name: CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build Docker Image & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin
            APP_DIR="/home/deep/ci-cd"
            echo "Navigating to project directory: $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -d ".git" ]; then
              echo "Pulling latest git changes..."
              git pull origin main || true
            fi

            echo "Logging in to GitHub Container Registry on VPS..."
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

            echo "Pulling latest image: $IMAGE_LOWER"
            docker pull "$IMAGE_LOWER"

            echo "Exporting built dist to $APP_DIR/dist..."
            docker create --name temp-dist-extract "$IMAGE_LOWER"
            rm -rf "$APP_DIR/dist"
            docker cp temp-dist-extract:/home/deep/ci-cd/dist "$APP_DIR/dist"
            docker rm temp-dist-extract

            if command -v docker-compose &> /dev/null || docker compose version &> /dev/null; then
              echo "Restarting via Docker Compose..."
              docker compose down || true
              docker compose up -d
            else
              echo "Restarting standalone container..."
              docker stop ci-cd-app || true
              docker rm ci-cd-app || true
              docker run -d \
                --name ci-cd-app \
                -p 3000:80 \
                --restart unless-stopped \
                "$IMAGE_LOWER"
            fi

            echo "Pruning unused docker images..."
            docker image prune -f

            echo "Deployment successful for cicd.yashan.me!"
